name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra presentbench
      - run: uv run ruff check .
      - run: uv run python -m unittest discover -s tests
      - run: diff -q AGENTS.md CLAUDE.md
      - run: uv run python -c "import google.genai, PIL, pptx, requests, tqdm"
      - run: uv run python scripts/data/validate_splits.py artifacts/splits/fewshot_splits.jsonl
      - run: uv run python scripts/ops/validate_run_artifacts.py --generated-outputs tests/fixtures/generated_outputs.valid.jsonl --skills tests/fixtures/skill_rows.valid.jsonl --eval tests/fixtures/eval_rows.valid.jsonl
      - run: uv run python scripts/eval/check_presentbench_official_eval_ready.py --packs artifacts/packs/example_packs.v1.jsonl --code-root data/PresentBench_code --judge-model gemini-3-flash-preview --limit-heldout 1 --allow-missing --allow-empty
      - run: uv run python scripts/ops/report_experiment_readiness.py --profile full --limit-heldout 1 --expect-status not_ready
