[project]
name = "auto-skill"
version = "0.1.0"
description = "Few-shot skill induction benchmark prototype"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
]
presentbench = [
  "google-genai>=1.11.0",
  "pillow>=10.0.0",
  "python-pptx>=1.0.0",
  "requests>=2.32.0",
  "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
